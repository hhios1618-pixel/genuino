# Supabase free pausa el proyecto tras 7 días sin actividad.
# Este workflow hace una consulta real a la base (listado de Storage) cada día
# y se re-habilita a sí mismo para que GitHub no lo apague tras 60 días sin commits.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: https://audszsghfitbfogbfjpf.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Falta el secret SUPABASE_ANON_KEY en el repo"
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/storage/v1/object/list/genuino-media" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":1}')
          echo "HTTP $status"
          cat response.json; echo
          [ "$status" -lt 300 ]

      - name: Mantener el workflow activo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
